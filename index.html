<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Valentine 💙</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #1b2a4e, #050b1e);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Poppins, sans-serif;
    }

    .card {
      background: rgba(10,20,50,0.9);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 0 40px rgba(100,150,255,0.4);
    }

    h1 {
      color: #7dd3ff;
    }

    p {
      color: #dbeafe;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: white;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Special Valentine 💙</h1>
    <p>This page is working perfectly 🌌</p>
    <button>YES 💙</button>
  </div>
</body>
</html>
