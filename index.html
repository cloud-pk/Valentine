<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💙</title>

<style>
*{box-sizing:border-box;font-family:Poppins,sans-serif;margin:0;padding:0;}
body{overflow:hidden;background:radial-gradient(circle at top,#1b2a4e,#050b1e);color:white;display:flex;align-items:center;justify-content:center;height:100vh;transition:opacity 1s ease;}

/* Stars background */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(1.5px 1.5px at 20% 30%,white 50%,transparent 51%),
    radial-gradient(1px 1px at 70% 60%,white 50%,transparent 51%),
    radial-gradient(2px 2px at 40% 80%,white 50%,transparent 51%);
  opacity:.6;
}

/* Card styling */
.card{
  background:rgba(10,20,50,.9);
  padding:30px;
  border-radius:24px;
  text-align:center;
  width:90%;
  max-width:360px;
  box-shadow:0 0 40px rgba(100,150,255,.4);
  position:relative;
  z-index:2;
}

/* Texts */
h1{color:#7dd3ff;}
p{color:#dbeafe;}

/* Buttons */
.buttons{position:relative;height:140px;}
button{
  border:none;
  padding:14px 26px;
  font-size:1.05rem;
  border-radius:40px;
  cursor:pointer;
  position:absolute;
}
.yes{background:linear-gradient(135deg,#3b82f6,#60a5fa);color:white;left:50%;transform:translateX(-120%);}
.no{background:#1f2933;color:#9ca3af;left:50%;transform:translateX(20%);}

/* Shooting stars */
.star{
  position:fixed;
  top:-50px;
  width:2px;
  height:80px;
  background:linear-gradient(white,transparent);
  animation:shoot 1.2s linear forwards;
  opacity:.8;
}
@keyframes shoot{to{transform:translate(-600px,600px) rotate(45deg);opacity:0;}}

/* Explosion hearts */
.particle{
  position:fixed;
  font-size:22px;
  pointer-events:none;
  animation:boom 1.4s forwards;
}
@keyframes boom{from{transform:scale(0);opacity:1} to{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}}

/* Second Page */
#secondPage{
  display:none;
  position:absolute;
  inset:0;
  background:radial-gradient(circle at top,#1b2a4e,#050b1e);
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:5;
  padding:20px;
  opacity:0;
  transition:opacity 1s ease;
}
#secondPage.show{display:flex;opacity:1;}
#secondPage h2{color:#ffb6b9;font-size:1.6rem;margin-bottom:20px;}
.penguins{display:flex;gap:10px;align-items:flex-end;}
.penguin-left{font-size:50px;transform:rotate(-10deg);}
.penguin-right{font-size:50px;transform:rotate(10deg);}
.kiss{position:relative;animation:kissAnim 1s infinite alternate;}
@keyframes kissAnim{
  0%{transform:translateX(0) translateY(0);}
  50%{transform:translateX(5px) translateY(-5px);}
  100%{transform:translateX(0) translateY(0);}
}

/* Mobile tweaks */
@media(max-width:480px){h1{font-size:1.6rem;}p{font-size:.95rem;} #secondPage h2{font-size:1.3rem;} .penguin-left,.penguin-right{font-size:40px;}}
</style>
</head>

<body>

<!-- Replace src with your uploaded slow love music file -->
<audio id="music" src="music.mp3" loop preload="auto"></audio>

<!-- Main Card -->
<div class="card" id="mainCard">
  <h1>Hey my universe 💙</h1>
  <p>
    Out of every galaxy and timeline,<br>
    I’d still choose you 🌌<br><br>
    Will you be my Valentine?
  </p>

  <div class="buttons">
    <button class="yes" id="yes">YES 💙</button>
    <button class="no" id="no">NO 🙄</button>
  </div>
</div>

<!-- Second Page -->
<div id="secondPage">
  <h2>Luuvu my Kongu Pengu 💕</h2>
  <div class="penguins">
    <div class="penguin-left kiss">🐧</div>
    <div class="penguin-right kiss">🐧</div>
  </div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const music=document.getElementById("music");
const mainCard=document.getElementById("mainCard");
const secondPage=document.getElementById("secondPage");

/* NO runs forever */
function moveNo(){
  noBtn.style.position="fixed";
  noBtn.style.left=Math.random()*(innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(innerHeight-60)+"px";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* YES = hearts + music + transition to second page */
yesBtn.onclick=()=>{
  // Play music safely
  music.currentTime=0;
  music.volume=0.5;
  const playPromise=music.play();
  if(playPromise!==undefined){
    playPromise.catch(()=>console.log("Audio blocked, tap again"));
  }

  // Hearts explosion
  for(let i=0;i<60;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.textContent=Math.random()>.5?"💙":"✨";
    p.style.left=Math.random()*innerWidth+"px";
    p.style.top=Math.random()*innerHeight+"px";
    p.style.setProperty("--x",(Math.random()-.5)*300+"px");
    p.style.setProperty("--y",(Math.random()-.5)*300+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1400);
  }

  // Fade transition to second page after 1.5s
  setTimeout(()=>{
    mainCard.style.display="none";
    secondPage.classList.add("show");
  },1500);
};

/* Shooting stars loop */
setInterval(()=>{
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*innerWidth+"px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1200);
},2000);
</script>

</body>
</html>
