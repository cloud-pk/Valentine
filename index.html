<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💙</title>

<style>
*{box-sizing:border-box;font-family:Poppins,sans-serif}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#1b2a4e,#050b1e);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

/* Stars */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(1.5px 1.5px at 20% 30%,white 50%,transparent 51%),
    radial-gradient(1px 1px at 70% 60%,white 50%,transparent 51%),
    radial-gradient(2px 2px at 40% 80%,white 50%,transparent 51%);
  opacity:.6;
}

.card{
  background:rgba(10,20,50,.9);
  padding:30px;
  border-radius:24px;
  text-align:center;
  width:90%;
  max-width:360px;
  box-shadow:0 0 40px rgba(100,150,255,.4);
  position:relative;
  z-index:2;
}

h1{color:#7dd3ff}
p{color:#dbeafe}

.buttons{
  position:relative;
  height:140px;
}

button{
  border:none;
  padding:14px 26px;
  font-size:1.05rem;
  border-radius:40px;
  cursor:pointer;
  position:absolute;
}

.yes{
  background:linear-gradient(135deg,#3b82f6,#60a5fa);
  color:white;
  left:50%;
  transform:translateX(-120%);
}

.no{
  background:#1f2933;
  color:#9ca3af;
  left:50%;
  transform:translateX(20%);
}

/* Shooting stars */
.star{
  position:fixed;
  top:-50px;
  width:2px;
  height:80px;
  background:linear-gradient(white,transparent);
  animation:shoot 1.2s linear forwards;
  opacity:.8;
}

@keyframes shoot{
  to{
    transform:translate(-600px,600px) rotate(45deg);
    opacity:0;
  }
}

/* Explosion */
.particle{
  position:fixed;
  font-size:22px;
  pointer-events:none;
  animation:boom 1.4s forwards;
}

@keyframes boom{
  from{transform:scale(0);opacity:1}
  to{
    transform:translate(var(--x),var(--y)) scale(1.4);
    opacity:0
  }
}

@media(max-width:480px){
  h1{font-size:1.6rem}
  p{font-size:.95rem}
}
</style>
</head>

<body>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop preload="auto"></audio>


<div class="card">
  <h1>Hey my universe 💙</h1>
  <p>
    Out of every galaxy and timeline,<br>
    I’d still choose you 🌌<br><br>
    Will you be my Valentine?
  </p>

  <div class="buttons">
    <button class="yes" id="yes">YES 💙</button>
    <button class="no" id="no">NO 🙄</button>
  </div>
  <div id="loveMessage" style="display:none; margin-top:20px; font-size:1.3rem; color:#7dd3ff; opacity:0; transition: opacity 1.5s ease;">
  💖 I luvvu my kongu pengu!! 💖
</div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const music = document.getElementById("music");
const loveMessage = document.getElementById("loveMessage");

/* NO runs forever */
function moveNo() {
  noBtn.style.position = "fixed";
  noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 60) + "px";
}
noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("touchstart", moveNo);

/* YES = love explosion + music + show message */
yesBtn.onclick = () => {
  // Force play on direct user click
  music.currentTime = 0; // restart from beginning
  music.volume = 0.5; // optional, softer
  const playPromise = music.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      console.log("Audio play was blocked, try tapping the page again");
    });
  }

  // Hearts explosion
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.textContent = Math.random() > 0.5 ? "💙" : "✨";
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.top = Math.random() * window.innerHeight + "px";
    p.style.setProperty("--x", (Math.random() - 0.5) * 300 + "px");
    p.style.setProperty("--y", (Math.random() - 0.5) * 300 + "px");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1400);
  }

  // Show "I love you" message
  loveMessage.style.display = "block";
  setTimeout(() => {
    loveMessage.style.opacity = 1;
  }, 100);
};
/* Shooting stars loop */
setInterval(()=>{
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*innerWidth+"px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1200);
},2000);
</script>

</body>
</html>
